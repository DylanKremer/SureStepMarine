name: Fix homepage logo links

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-homepage-links.yml

permissions:
  contents: write

jobs:
  fix-links:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace index-light references
        shell: python
        run: |
          from pathlib import Path

          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('index-light.html', 'index.html')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated files:')
          for item in changed:
              print(item)

      - name: Commit homepage link fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Fix homepage logo links"
          git push
