name: Mobile layout polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-layout-polish.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  polish-and-deploy:
    if: ${{ github.actor != 'github-actions[bot]' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Improve mobile navigation and spacing
        shell: python
        run: |
          from pathlib import Path

          css = r'''
          /* mobile-polish-v1 */
          .mobile-menu-toggle{display:none;width:46px;height:46px;padding:0;border:1px solid var(--line,rgba(16,32,46,.12));border-radius:9px;background:#fff;align-items:center;justify-content:center;flex-direction:column;gap:5px;cursor:pointer;flex:0 0 auto}
          .mobile-menu-toggle span{display:block;width:20px;height:2px;background:var(--text,#10202e);border-radius:2px;transition:.2s}
          .mobile-menu-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
          .mobile-menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
          .mobile-menu-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
          .mobile-quote-link{display:none}
          @media(max-width:980px){
            header .wrap{position:relative}
            nav{position:relative}
            .mobile-menu-toggle{display:inline-flex}
            .nav-links{position:absolute!important;top:calc(100% + 1px);left:0;right:0;z-index:50;display:none!important;flex-direction:column!important;align-items:stretch!important;gap:2px!important;padding:10px!important;background:rgba(255,255,255,.99)!important;border:1px solid var(--line,rgba(16,32,46,.12));border-radius:0 0 12px 12px;box-shadow:0 18px 40px rgba(16,32,46,.14)}
            .nav-links.mobile-open{display:flex!important}
            .nav-links a{display:block;padding:12px 14px;border-radius:8px}
            .nav-links a:hover,.nav-links a.active{background:#eef6fc}
            .mobile-quote-link{display:block!important;margin-top:6px!important;background:var(--accent,#0b7fd1)!important;color:#fff!important;text-align:center;font-weight:800}
            .mobile-quote-link:hover{background:#096eb5!important;color:#fff!important}
          }
          @media(max-width:700px){
            .nav-cta{display:none!important}
          }
          @media(max-width:620px){
            body{overflow-x:hidden}
            nav{min-height:72px!important;gap:10px!important}
            .brand img{width:min(185px,55vw)!important;height:auto}
            .mobile-menu-toggle{width:44px;height:44px}
            h1,.hero h1,.quote-hero h1{font-size:clamp(2.15rem,11vw,3rem)!important;line-height:1.02!important}
            section{scroll-margin-top:76px}
            .hero-actions,.cta-actions,.product-actions{flex-direction:column!important;align-items:stretch!important}
            .hero-actions .btn,.cta-actions .btn,.product-actions .btn{width:100%;max-width:none}
            .hero-card{min-height:300px!important}
            .quote,.quote-box,.cta,.approval{padding:26px 20px!important}
            input,select,textarea,button{font-size:16px}
            .faq-item summary{line-height:1.35}
          }
          @media(max-width:420px){
            .steps{grid-template-columns:1fr!important}
            .panel-stage{min-height:300px!important}
            .panel-board{width:92%!important}
          }
          '''

          script = r'''
          <script>
          (() => {
            const button = document.querySelector('.mobile-menu-toggle');
            const menu = document.querySelector('.nav-links');
            if (!button || !menu) return;
            const closeMenu = () => {
              menu.classList.remove('mobile-open');
              button.setAttribute('aria-expanded','false');
            };
            button.addEventListener('click', () => {
              const open = menu.classList.toggle('mobile-open');
              button.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
            menu.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
            document.addEventListener('click', event => {
              if (!event.target.closest('nav')) closeMenu();
            });
            document.addEventListener('keydown', event => {
              if (event.key === 'Escape') closeMenu();
            });
            window.addEventListener('resize', () => {
              if (window.innerWidth > 980) closeMenu();
            });
          })();
          </script>
          '''

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              if 'mobile-polish-v1' not in text and '</style>' in text:
                  text = text.replace('</style>', css + '\n</style>', 1)

              nav_start = text.find('<div class="nav-links">')
              if nav_start >= 0:
                  if 'class="mobile-menu-toggle"' not in text:
                      button = '<button class="mobile-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>\n'
                      text = text[:nav_start] + button + text[nav_start:]

                  nav_start = text.find('<div class="nav-links">')
                  nav_end = text.find('</div>', nav_start)
                  if nav_end >= 0:
                      nav_html = text[nav_start:nav_end]
                      if 'mobile-quote-link' not in nav_html:
                          quote_link = '<a class="mobile-quote-link" href="quote.html">Get a Quote</a>'
                          text = text[:nav_end] + quote_link + text[nav_end:]

                  if 'const button = document.querySelector(\'.mobile-menu-toggle\')' not in text and '</body>' in text:
                      text = text.replace('</body>', script + '\n</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Mobile-polished files:')
          for item in changed:
              print(item)

      - name: Commit mobile improvements
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "Improve mobile layouts and navigation"
            git push
          else
            echo "No mobile changes needed."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload mobile-polished site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy mobile-polished site
        id: deployment
        uses: actions/deploy-pages@v4
