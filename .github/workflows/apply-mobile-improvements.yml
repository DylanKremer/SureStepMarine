name: Apply mobile improvements

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-mobile-improvements.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    if: ${{ github.actor != 'github-actions[bot]' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add shared mobile CSS and JS to every page
        shell: python
        run: |
          from pathlib import Path

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              if 'assets/mobile.css' not in text:
                  text = text.replace(
                      '</head>',
                      '<link rel="stylesheet" href="assets/mobile.css">\n</head>',
                      1
                  )

              if 'assets/mobile.js' not in text:
                  text = text.replace(
                      '</body>',
                      '<script src="assets/mobile.js"></script>\n</body>',
                      1
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated pages:')
          for item in changed:
              print(item)

          missing = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'assets/mobile.css' not in text or 'assets/mobile.js' not in text:
                  missing.append(str(path))
          if missing:
              raise SystemExit('Mobile assets missing from: ' + ', '.join(missing))

      - name: Commit mobile updates
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "Apply mobile navigation and layout improvements"
            git push
          else
            echo "No HTML changes needed."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload updated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
