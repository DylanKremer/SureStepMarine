name: Add Materials and Options button

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-materials-options-button.yml

permissions:
  contents: write

jobs:
  update-homepage:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add button to design options section
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          target = '''          <p>Start with one of our core patterns or build something unique. Color combinations, logos, rulers, borders, and custom artwork can all be incorporated into the design.</p>'''
          replacement = '''          <p>Start with one of our core patterns or build something unique. Color combinations, logos, rulers, borders, and custom artwork can all be incorporated into the design.</p>
          <div style="margin-top:18px"><a class="btn btn-secondary" href="materials-options.html">Explore Materials &amp; Options</a></div>'''

          if 'Explore Materials &amp; Options' in text:
              print('Button already present; no change needed.')
          elif target not in text:
              raise SystemExit('Could not find the design-options intro paragraph.')
          else:
              path.write_text(text.replace(target, replacement, 1), encoding='utf-8')

      - name: Commit homepage update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Materials and Options button to homepage"
          git push
