name: Add FAQ navigation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-faq-navigation.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    if: ${{ github.actor != 'github-actions[bot]' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add FAQ link to navigation on every page
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')

              nav_start = text.find('<div class="nav-links">')
              if nav_start < 0:
                  continue
              nav_end = text.find('</div>', nav_start)
              if nav_end < 0:
                  continue

              nav = text[nav_start:nav_end]
              if 'href="faq.html"' in nav:
                  continue

              updated_nav, count = re.subn(
                  r'(<a[^>]*href="process\.html"[^>]*>Process</a>)',
                  r'\1<a href="faq.html">FAQ</a>',
                  nav,
                  count=1
              )
              if count == 0:
                  raise SystemExit(f'Could not place FAQ link in navigation for {path}')

              text = text[:nav_start] + updated_nav + text[nav_end:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Updated navigation in:')
          for item in changed:
              print(item)

          # Verify every top-level HTML page has an FAQ link in its nav.
          missing = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              nav_start = text.find('<div class="nav-links">')
              if nav_start < 0:
                  continue
              nav_end = text.find('</div>', nav_start)
              nav = text[nav_start:nav_end]
              if 'href="faq.html"' not in nav:
                  missing.append(str(path))
          if missing:
              raise SystemExit('FAQ nav link missing in: ' + ', '.join(missing))

      - name: Commit navigation updates
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "Add FAQ link to site navigation"
            git push
          else
            echo "No navigation changes needed."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload updated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
